name: build repo

on:
  push:
    branches: [OnTheSide]
    paths: ['Later/**', 'tools/make_repo.py', 'tools/_source/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run make_repo.py
        run: python3 tools/make_repo.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "rebuild repo"
            git push
          fi
