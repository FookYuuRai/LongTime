name: build repo

on:
  push:
    branches:
      - OnTheSide
    paths:
      - 'Later/**'
      # ZIP uploads are sequenced through update-nightshift-ambience-pack.yml.
      # That workflow dispatches this build after its pack check completes.
      - '!Later/*.zip'
      - '!Later/**/*.zip'
      - 'tools/make_repo.py'
      - 'tools/validate_repo_files.py'
      - 'tools/_source/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-repo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: OnTheSide

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Validate source Now and Later payloads
        run: python3 tools/validate_repo_files.py --areas Now Later

      - name: Generate Kodi repository files
        run: python3 tools/make_repo.py

      - name: Validate generated Now and remaining Later payloads
        run: python3 tools/validate_repo_files.py --areas Now Later

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "rebuild repo"
            git push origin HEAD:OnTheSide
          fi

      # GITHUB_TOKEN pushes do not start another workflow from a push event.
      # Explicitly deploy Pages after the repository build completes.
      - name: Dispatch GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref OnTheSide

      # Do not dispatch pruning here: dispatching Pages only queues it.
      # prune-old-runs.yml now waits for the Pages workflow's completed event.
