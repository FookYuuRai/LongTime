name: LongTime upload-to-publish pipeline

on:
  push:
    branches:
      - OnTheSide
    paths:
      - 'Later/**'
      - 'Now/**'
      - 'index.html'
      - 'tools/make_repo.py'
      - 'tools/validate_repo_files.py'
      - 'tools/_source/**'
      - '.github/workflows/**'

  schedule:
    - cron: '23 */6 * * *'

  workflow_dispatch:
    inputs:
      pack_url:
        description: "HTTPS URL for the ambience audio pack (leave blank for the default)"
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: longtime-upload-publish-pipeline
  cancel-in-progress: false

jobs:
  make-repository-public:
    name: "0. Ensure repository is public"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Change repository visibility to public
        env:
          GH_TOKEN: ${{ secrets.PAGES_ENABLEMENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::PAGES_ENABLEMENT_TOKEN is missing."
            exit 1
          fi

          echo "Changing repository visibility to public..."
          RESPONSE="$(gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}" \
            --input - <<'JSON'
          {
            "private": false
          }
          JSON
          )"

          VISIBILITY="$(printf '%s' "$RESPONSE" | jq -r '.visibility')"
          IS_PRIVATE="$(printf '%s' "$RESPONSE" | jq -r '.private')"

          if [[ "$VISIBILITY" != "public" || "$IS_PRIVATE" != "false" ]]; then
            echo "::error::GitHub did not confirm that the repository is public."
            printf '%s\n' "$RESPONSE" | jq '{visibility, private}'
            exit 1
          fi

          echo "Repository visibility confirmed: public."

  update-ambience:
    name: "1. Update ambience audio pack"
    needs:
      - make-repository-public
    if: ${{ always() && needs.make-repository-public.result == 'success' }}
    uses: ./.github/workflows/update-nightshift-ambience-pack.yml
    with:
      pack_url: ${{ inputs.pack_url || 'https://github.com/FookYuuRai/LongTime/releases/download/ambience-audio-v1/ambience-audio-opus96.zip' }}
    permissions:
      contents: write

  build-repo:
    name: "2. Build repository"
    needs:
      - make-repository-public
      - update-ambience
    if: ${{ always() && needs.make-repository-public.result == 'success' && needs.update-ambience.result == 'success' }}
    uses: ./.github/workflows/build-repo.yml
    permissions:
      contents: write

  publish-pages:
    name: "3. Publish GitHub Pages"
    needs:
      - make-repository-public
      - update-ambience
      - build-repo
    if: ${{ always() && needs.make-repository-public.result == 'success' && needs.update-ambience.result == 'success' && needs.build-repo.result == 'success' }}
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write

  prune-history:
    name: "4. Prune old workflow runs and inactive deployments"
    needs:
      - make-repository-public
      - update-ambience
      - build-repo
      - publish-pages
    if: ${{ always() && needs.make-repository-public.result == 'success' && needs.update-ambience.result == 'success' && needs.build-repo.result == 'success' && needs.publish-pages.result == 'success' }}
    uses: ./.github/workflows/prune-old-runs.yml
    with:
      pipeline_run: true
    permissions:
      actions: write
      deployments: write
