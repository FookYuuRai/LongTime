name: Prune old workflow history

on:
  workflow_call:
    inputs:
      pipeline_run:
        description: Set true when called as the final stage of pipeline.yml
        required: false
        type: boolean
        default: false

  workflow_run:
    workflows:
      - Update pinned GitHub Actions
    types:
      - completed
    branches:
      - OnTheSide

  workflow_dispatch:
    inputs:
      workflow_file:
        description: Select which workflow history to prune
        required: true
        type: choice
        options:
          - pipeline.yml
          - build-repo.yml
          - pages.yml
          - update-action-pins.yml
          - pages.yml (delete all Pages workflow history)
      confirm_cleanup:
        description: Type DELETE to confirm removing workflow history
        required: true
        type: choice
        default: NO
        options:
          - NO
          - DELETE

permissions:
  actions: write
  deployments: write

concurrency:
  group: prune-old-workflow-runs
  cancel-in-progress: false

jobs:
  prune:
    if: >-
      inputs.pipeline_run == true ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirm_cleanup == 'DELETE')

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Prune old workflow history and inactive deployments
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ inputs.pipeline_run && 'pipeline.yml' || (github.event_name == 'workflow_run' && github.event.workflow_run.workflow_id || inputs.workflow_file || 'pipeline.yml') }}
          PIPELINE_RUN: ${{ inputs.pipeline_run }}
          TARGET_BRANCH: OnTheSide
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const repository = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;
          const eventName = process.env.EVENT_NAME;
          const workflowRef = process.env.WORKFLOW_REF;
          const pipelineRun = process.env.PIPELINE_RUN === "true";
          const branch = process.env.TARGET_BRANCH;
          const currentRunId = process.env.CURRENT_RUN_ID;

          const TIME_ZONE = "America/Chicago";
          const PAGES_WORKFLOW_PATH =
            ".github/workflows/pages.yml";

          const PAGES_ALL_OPTION =
            "pages.yml (delete all Pages workflow history)";

          const SELF_WORKFLOW_PATH =
            ".github/workflows/prune-old-runs.yml";

          if (
            !repository ||
            !token ||
            !workflowRef ||
            !branch ||
            !currentRunId
          ) {
            throw new Error(
              "Missing required repository, workflow, branch, token, or run ID."
            );
          }

          // Return YYYY-MM-DD in the requested IANA timezone.
          // Do not use toISOString().slice(0, 10) for local-date retention:
          // toISOString() always returns the UTC calendar date.
          function dateInTimeZone(date, timeZone = TIME_ZONE) {
            const parts = new Intl.DateTimeFormat("en-US", {
              timeZone,
              year: "numeric",
              month: "2-digit",
              day: "2-digit"
            }).formatToParts(date);

            const values = Object.fromEntries(
              parts.map(part => [part.type, part.value])
            );

            return `${values.year}-${values.month}-${values.day}`;
          }

          function localRunDate(run) {
            if (typeof run.created_at !== "string") {
              return null;
            }

            const date = new Date(run.created_at);

            if (Number.isNaN(date.getTime())) {
              return null;
            }

            return dateInTimeZone(date);
          }

          // Runs dated today in Central Time are retained.
          // Only completed runs whose Central Time date is earlier than
          // this cutoff date are eligible for deletion.
          const cutoffDate = dateInTimeZone(new Date());

          console.log(`Repository: ${repository}`);
          console.log(`Branch: ${branch}`);
          console.log(`Current cleanup run: ${currentRunId}`);
          console.log(`Retention timezone: ${TIME_ZONE}`);
          console.log(`Retention cutoff (${TIME_ZONE}): ${cutoffDate}`);
          console.log(
            `Completed runs dated before ${cutoffDate} in ${TIME_ZONE} are eligible for deletion.`
          );
          console.log(
            `Deployments dated before ${cutoffDate} in ${TIME_ZONE} are eligible when inactive, or when their latest status is failure/error and can safely be marked inactive.`
          );

          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28"
          };

          async function githubApi(path, options = {}) {
            const response = await fetch(
              `https://api.github.com${path}`,
              {
                ...options,
                headers: {
                  ...headers,
                  ...(options.headers || {})
                }
              }
            );

            if (!response.ok) {
              throw new Error(
                `GitHub API ${options.method || "GET"} ${path} failed: ` +
                `${response.status} ${response.statusText}\n` +
                await response.text()
              );
            }

            if (response.status === 204) {
              return null;
            }

            return response.json();
          }

          async function listWorkflows() {
            const workflows = [];

            for (let page = 1; page <= 10; page++) {
              const result = await githubApi(
                `/repos/${repository}/actions/workflows?per_page=100&page=${page}`
              );

              const items = result.workflows || [];

              workflows.push(...items);

              if (items.length < 100) {
                break;
              }
            }

            return workflows;
          }

          async function findWorkflowIdByPath(path, label) {
            const workflows = await listWorkflows();

            const matches = workflows.filter(
              workflow => workflow.path === path
            );

            if (matches.length !== 1) {
              throw new Error(
                `${label}: expected exactly one workflow at ${path}; ` +
                `found ${matches.length}. No history was deleted for it.`
              );
            }

            const workflow = matches[0];

            console.log(
              `Verified ${label}: ${workflow.name}; ` +
              `ID ${workflow.id}; path ${workflow.path}`
            );

            return workflow.id;
          }

          async function getWorkflowRuns(workflowIdOrFile, branchFilter) {
            const runs = [];

            // GitHub accepts a workflow ID or workflow filename.
            for (let page = 1; page <= 10; page++) {
              const parameters = new URLSearchParams({
                per_page: "100",
                page: String(page)
              });

              if (branchFilter) {
                parameters.set("branch", branchFilter);
              }

              const path =
                `/repos/${repository}/actions/workflows/` +
                `${encodeURIComponent(String(workflowIdOrFile))}/runs?${parameters}`;

              const result = await githubApi(path);
              const pageRuns = result.workflow_runs || [];

              runs.push(...pageRuns);

              if (pageRuns.length < 100) {
                break;
              }
            }

            return runs;
          }

          async function deleteCompletedRuns(
            runs,
            shouldDelete,
            label
          ) {
            const completedRuns = runs.filter(
              run => run.status === "completed"
            );

            const selected = completedRuns.filter(shouldDelete);

            const validDates = runs
              .map(run => ({
                run,
                localDate: localRunDate(run)
              }))
              .filter(item => item.localDate !== null)
              .sort((a, b) =>
                a.localDate.localeCompare(b.localDate)
              );

            console.log("");
            console.log(`--- ${label} ---`);
            console.log(`Runs returned by API: ${runs.length}`);
            console.log(`Completed runs: ${completedRuns.length}`);
            console.log(`Completed runs selected: ${selected.length}`);

            if (validDates.length > 0) {
              const oldest = validDates[0];
              const newest = validDates[validDates.length - 1];

              console.log(
                `Oldest returned run: ${oldest.run.id}; ` +
                `UTC=${oldest.run.created_at}; ` +
                `${TIME_ZONE}=${oldest.localDate}`
              );

              console.log(
                `Newest returned run: ${newest.run.id}; ` +
                `UTC=${newest.run.created_at}; ` +
                `${TIME_ZONE}=${newest.localDate}`
              );
            }

            if (runs.length === 0) {
              console.log(
                "No standalone workflow runs were returned for this workflow identifier and branch."
              );
            }

            let deleted = 0;
            let failed = 0;

            for (const run of selected) {
              const runDate = localRunDate(run);

              // Never delete the currently executing cleanup run.
              if (String(run.id) === String(currentRunId)) {
                console.log(
                  `Keeping current cleanup run ${run.id}.`
                );
                continue;
              }

              try {
                await githubApi(
                  `/repos/${repository}/actions/runs/${run.id}`,
                  { method: "DELETE" }
                );

                deleted++;

                console.log(
                  `Deleted ${label} run ${run.id}: ` +
                  `UTC=${run.created_at}; ` +
                  `${TIME_ZONE}=${runDate}; ` +
                  `conclusion=${run.conclusion || run.status}`
                );
              } catch (error) {
                failed++;

                console.error(
                  `Could not delete ${label} run ${run.id}: ${error.message}`
                );
              }

              await new Promise(resolve =>
                setTimeout(resolve, 150)
              );
            }

            console.log(
              `${label}: deleted ${deleted}; failed ${failed}.`
            );

            if (failed > 0) {
              throw new Error(
                `${failed} ${label} run(s) could not be deleted.`
              );
            }
          }

          async function pruneBeforeDate(
            workflowIdOrFile,
            branchFilter,
            label
          ) {
            const runs = await getWorkflowRuns(
              workflowIdOrFile,
              branchFilter
            );

            await deleteCompletedRuns(
              runs,
              run => {
                const runDate = localRunDate(run);

                return (
                  runDate !== null &&
                  runDate < cutoffDate &&
                  String(run.id) !== String(currentRunId)
                );
              },
              label
            );
          }

          async function pruneAllPagesHistory() {
            // Resolve the Pages workflow dynamically instead of hard-coding
            // its workflow ID.
            const pagesWorkflowId = await findWorkflowIdByPath(
              PAGES_WORKFLOW_PATH,
              "Publish GitHub Pages"
            );

            // No branch filter: include all completed runs returned for
            // this workflow across branches and dates.
            const runs = await getWorkflowRuns(
              pagesWorkflowId,
              null
            );

            // Only reachable through manual DELETE confirmation.
            await deleteCompletedRuns(
              runs,
              () => true,
              "all pages.yml workflow history"
            );
          }

          async function pruneOwnOlderRuns() {
            const ownWorkflowId = await findWorkflowIdByPath(
              SELF_WORKFLOW_PATH,
              "Prune old workflow history"
            );

            const ownRuns = await getWorkflowRuns(
              ownWorkflowId,
              branch
            );

            await deleteCompletedRuns(
              ownRuns,
              run => {
                const runDate = localRunDate(run);

                return (
                  String(run.id) !== String(currentRunId) &&
                  runDate !== null &&
                  runDate < cutoffDate
                );
              },
              "prune-old-runs.yml"
            );
          }

          // Retrieve all deployments, retaining the original workflow's
          // ten-page / 100-items-per-page pagination convention.
          async function getAllDeployments() {
            const deployments = [];

            for (let page = 1; page <= 10; page++) {
              const items = await githubApi(
                `/repos/${repository}/deployments?per_page=100&page=${page}`
              );

              if (!Array.isArray(items)) {
                throw new Error(
                  `Unexpected deployments response on page ${page}.`
                );
              }

              deployments.push(...items);

              if (items.length < 100) {
                break;
              }
            }

            return deployments;
          }

          // GitHub returns deployment statuses newest-first.
          // Read the first page and explicitly select the newest timestamp
          // (using the status ID to break timestamp ties).
          // A deployment with no status is not considered safe to delete.
          async function getLatestDeploymentStatus(deploymentId) {
            const statuses = await githubApi(
              `/repos/${repository}/deployments/${encodeURIComponent(String(deploymentId))}/statuses?per_page=100&page=1`
            );

            if (!Array.isArray(statuses)) {
              throw new Error(
                `Unexpected status response for deployment ${deploymentId}.`
              );
            }

            if (statuses.length === 0) {
              return null;
            }

            statuses.sort((a, b) => {
              const timeA = Date.parse(a.created_at || "");
              const timeB = Date.parse(b.created_at || "");

              if (
                Number.isFinite(timeA) &&
                Number.isFinite(timeB) &&
                timeA !== timeB
              ) {
                return timeB - timeA;
              }

              return Number(b.id || 0) - Number(a.id || 0);
            });

            return statuses[0];
          }

          // Mark only old failed/errored deployments inactive before
          // deletion. GitHub requires an inactive deployment status
          // before a deployment can be deleted.
          async function markDeploymentInactive(deploymentId, previousState) {
            const status = await githubApi(
              `/repos/${repository}/deployments/${encodeURIComponent(String(deploymentId))}/statuses`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  state: "inactive",
                  description:
                    `Marked inactive by age-based cleanup (previous state: ${previousState}).`
                })
              }
            );

            if (
              !status ||
              typeof status.state !== "string" ||
              status.state.toLowerCase() !== "inactive"
            ) {
              throw new Error(
                `GitHub did not confirm the inactive status for deployment ${deploymentId}.`
              );
            }

            return status;
          }

          async function pruneOldInactiveDeployments() {
            console.log("");
            console.log("--- old inactive GitHub deployments ---");

            const deployments = await getAllDeployments();

            const validDates = deployments
              .map(deployment => ({
                deployment,
                localDate: localRunDate(deployment)
              }))
              .filter(item => item.localDate !== null)
              .sort((a, b) =>
                a.localDate.localeCompare(b.localDate)
              );

            const oldDeployments = deployments.filter(deployment => {
              const deploymentDate = localRunDate(deployment);

              return (
                deploymentDate !== null &&
                deploymentDate < cutoffDate
              );
            });

            console.log(`Deployments returned by API: ${deployments.length}`);
            console.log(`Deployments dated before cutoff: ${oldDeployments.length}`);
            console.log(`Deployments dated today or later: ${deployments.length - oldDeployments.length}`);

            if (validDates.length > 0) {
              const oldest = validDates[0];
              const newest = validDates[validDates.length - 1];

              console.log(
                `Oldest deployment: ${oldest.deployment.id}; ` +
                `UTC=${oldest.deployment.created_at}; ` +
                `${TIME_ZONE}=${oldest.localDate}`
              );

              console.log(
                `Newest deployment: ${newest.deployment.id}; ` +
                `UTC=${newest.deployment.created_at}; ` +
                `${TIME_ZONE}=${newest.localDate}`
              );
            }

            if (deployments.length === 0) {
              console.log("No deployments were returned by the API.");
            }

            let deleted = 0;
            let markedInactive = 0;
            let keptNonInactive = 0;
            let keptUnknown = 0;
            let failed = 0;

            for (const deployment of oldDeployments) {
              const deploymentDate = localRunDate(deployment);
              const deploymentId = deployment.id;

              if (!deploymentId) {
                keptUnknown++;

                console.log(
                  "Keeping old deployment without a readable ID; status cannot be verified."
                );

                continue;
              }

              let latestStatus;

              try {
                latestStatus = await getLatestDeploymentStatus(
                  deploymentId
                );
              } catch (error) {
                failed++;

                console.error(
                  `Could not verify latest status for deployment ${deploymentId}; keeping it: ${error.message}`
                );

                continue;
              }

              if (
                !latestStatus ||
                typeof latestStatus.state !== "string"
              ) {
                keptUnknown++;

                console.log(
                  `Keeping deployment ${deploymentId}: ` +
                  `no readable latest status; ` +
                  `UTC=${deployment.created_at}; ` +
                  `${TIME_ZONE}=${deploymentDate}.`
                );

                continue;
              }

              const latestState = latestStatus.state.toLowerCase();

              // Already inactive: eligible for deletion.
              // Failure/error: mark inactive first, then delete.
              // Every other state is retained.
              const needsInactiveStatus =
                latestState === "failure" ||
                latestState === "error";

              if (
                latestState !== "inactive" &&
                !needsInactiveStatus
              ) {
                keptNonInactive++;

                console.log(
                  `Keeping deployment ${deploymentId}: ` +
                  `latest state=${latestState}; ` +
                  `environment=${deployment.environment || "unknown"}; ` +
                  `UTC=${deployment.created_at}; ` +
                  `${TIME_ZONE}=${deploymentDate}.`
                );

                continue;
              }

              try {
                if (needsInactiveStatus) {
                  await markDeploymentInactive(
                    deploymentId,
                    latestState
                  );

                  markedInactive++;

                  console.log(
                    `Marked old ${latestState} deployment ${deploymentId} inactive.`
                  );
                }

                await githubApi(
                  `/repos/${repository}/deployments/${encodeURIComponent(String(deploymentId))}`,
                  { method: "DELETE" }
                );

                deleted++;

                console.log(
                  `Deleted old deployment ${deploymentId}: ` +
                  `environment=${deployment.environment || "unknown"}; ` +
                  `UTC=${deployment.created_at}; ` +
                  `${TIME_ZONE}=${deploymentDate}; ` +
                  `previous status=${latestState}.`
                );
              } catch (error) {
                failed++;

                console.error(
                  `Could not clean up deployment ${deploymentId}: ${error.message}`
                );
              }

              await new Promise(resolve =>
                setTimeout(resolve, 150)
              );
            }

            console.log(
              `Deployment cleanup: deleted ${deleted}; ` +
              `marked inactive ${markedInactive}; ` +
              `kept non-inactive ${keptNonInactive}; ` +
              `kept unknown ${keptUnknown}; ` +
              `failed ${failed}.`
            );

            if (failed > 0) {
              throw new Error(
                `${failed} deployment status lookup(s), status update(s), or deletion(s) failed.`
              );
            }
          }

          async function main() {
            if (pipelineRun) {
              console.log(
                "Pipeline cleanup: pruning old workflow history."
              );

              // These files are reusable workflow_call workflows in the
              // current pipeline. Their jobs appear inside pipeline runs;
              // they do not necessarily have separate run-history entries.
              console.log(
                "Note: reusable workflow job history is contained in its parent pipeline run."
              );

              // Remove old GitHub Actions pin updater runs.
              await pruneBeforeDate(
                "update-action-pins.yml",
                branch,
                "update-action-pins.yml"
              );

              // Remove old parent pipeline runs. This also removes their
              // nested reusable-workflow job history from the Actions UI.
              await pruneBeforeDate(
                "pipeline.yml",
                branch,
                "pipeline.yml"
              );

            } else if (eventName === "workflow_run") {
              console.log(
                `Automatic cleanup after successful workflow ${workflowRef}.`
              );

              await pruneBeforeDate(
                workflowRef,
                branch,
                `workflow ${workflowRef}`
              );

            } else if (workflowRef === PAGES_ALL_OPTION) {
              await pruneAllPagesHistory();

            } else {
              await pruneBeforeDate(
                workflowRef,
                branch,
                workflowRef
              );
            }

            // Remove old deployments that are inactive or can safely
            // be marked inactive because their latest state is failure/error.
            // Today's deployments and all other states remain protected.
            await pruneOldInactiveDeployments();

            // Keep today's cleanup run and remove only older completed
            // cleanup workflow runs.
            await pruneOwnOlderRuns();

            console.log(
              `Workflow-history and deployment cleanup completed for cutoff ${cutoffDate} (${TIME_ZONE}).`
            );
          }

          main().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
