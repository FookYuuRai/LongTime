name: Prune old workflow history

on:
  workflow_call:
    inputs:
      pipeline_run:
        description: Set true when called as the final stage of pipeline.yml
        required: false
        type: boolean
        default: false

  workflow_run:
    workflows:
      - Update pinned GitHub Actions
    types:
      - completed
    branches:
      - OnTheSide

  workflow_dispatch:
    inputs:
      workflow_file:
        description: Select which workflow history to prune
        required: true
        type: choice
        options:
          - pipeline.yml
          - build-repo.yml
          - pages.yml
          - update-action-pins.yml
          - pages-build-deployment (delete all generated history)

      confirm_cleanup:
        description: Type DELETE to confirm removing workflow history
        required: true
        type: choice
        default: NO
        options:
          - NO
          - DELETE

permissions:
  actions: write

concurrency:
  group: prune-old-workflow-runs
  cancel-in-progress: false

jobs:
  prune:
    if: >-
      inputs.pipeline_run == true ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirm_cleanup == 'DELETE')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Prune workflow history older than the current UTC date
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ inputs.pipeline_run && 'pipeline.yml' || (github.event_name == 'workflow_run' && github.event.workflow_run.workflow_id || inputs.workflow_file || 'pipeline.yml') }}
          PIPELINE_RUN: ${{ inputs.pipeline_run }}
          TARGET_BRANCH: OnTheSide
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const repository = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;
          const eventName = process.env.EVENT_NAME;
          const workflowRef = process.env.WORKFLOW_REF;
          const pipelineRun = process.env.PIPELINE_RUN === "true";
          const branch = process.env.TARGET_BRANCH;
          const currentRunId = process.env.CURRENT_RUN_ID;

          const LEGACY_PAGES_PATH =
            "dynamic/pages/pages-build-deployment";
          const LEGACY_OPTION =
            "pages-build-deployment (delete all generated history)";
          const SELF_WORKFLOW_PATH =
            ".github/workflows/prune-old-runs.yml";

          if (
            !repository ||
            !token ||
            !workflowRef ||
            !branch ||
            !currentRunId
          ) {
            throw new Error(
              "Missing required repository, workflow, branch, token, or run ID."
            );
          }

          // Use today's actual UTC date. Runs created today are retained.
          const cutoffDate = new Date().toISOString().slice(0, 10);

          console.log(`Repository: ${repository}`);
          console.log(`Branch: ${branch}`);
          console.log(`Current cleanup run: ${currentRunId}`);
          console.log(`Retention cutoff (UTC): ${cutoffDate}`);
          console.log(
            "Completed runs created before this UTC date are eligible for deletion."
          );

          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28"
          };

          async function githubApi(path, options = {}) {
            const response = await fetch(
              `https://api.github.com${path}`,
              {
                ...options,
                headers: {
                  ...headers,
                  ...(options.headers || {})
                }
              }
            );

            if (!response.ok) {
              throw new Error(
                `GitHub API ${options.method || "GET"} ${path} failed: ` +
                `${response.status} ${response.statusText}\n` +
                await response.text()
              );
            }

            if (response.status === 204) return null;
            return response.json();
          }

          async function listWorkflows() {
            const workflows = [];

            for (let page = 1; page <= 10; page++) {
              const result = await githubApi(
                `/repos/${repository}/actions/workflows?per_page=100&page=${page}`
              );

              const items = result.workflows || [];
              workflows.push(...items);

              if (items.length < 100) break;
            }

            return workflows;
          }

          async function getWorkflowRuns(workflowIdOrFile, branchFilter) {
            const runs = [];

            // Fetch up to 1,000 runs per workflow.
            for (let page = 1; page <= 10; page++) {
              const parameters = new URLSearchParams({
                per_page: "100",
                page: String(page)
              });

              if (branchFilter) {
                parameters.set("branch", branchFilter);
              }

              const path =
                `/repos/${repository}/actions/workflows/` +
                `${encodeURIComponent(workflowIdOrFile)}/runs?${parameters}`;

              const result = await githubApi(path);
              const pageRuns = result.workflow_runs || [];

              runs.push(...pageRuns);

              if (pageRuns.length < 100) break;
            }

            return runs;
          }

          async function deleteCompletedRuns(runs, shouldDelete, label) {
            const selected = runs.filter(run =>
              run.status === "completed" && shouldDelete(run)
            );

            console.log(
              `${label}: inspected ${runs.length} run(s); ` +
              `${selected.length} completed run(s) selected.`
            );

            let deleted = 0;
            let failed = 0;

            for (const run of selected) {
              try {
                await githubApi(
                  `/repos/${repository}/actions/runs/${run.id}`,
                  { method: "DELETE" }
                );

                deleted++;

                console.log(
                  `Deleted ${label} run ${run.id}: ${run.created_at} ` +
                  `(${run.conclusion || run.status})`
                );
              } catch (error) {
                failed++;

                console.error(
                  `Could not delete ${label} run ${run.id}: ${error.message}`
                );
              }

              await new Promise(resolve => setTimeout(resolve, 150));
            }

            console.log(
              `${label}: deleted ${deleted}; failed ${failed}.`
            );

            if (failed > 0) {
              throw new Error(
                `${failed} ${label} run(s) could not be deleted.`
              );
            }
          }

          async function pruneBeforeDate(
            workflowIdOrFile,
            branchFilter,
            label
          ) {
            const runs = await getWorkflowRuns(
              workflowIdOrFile,
              branchFilter
            );

            await deleteCompletedRuns(
              runs,
              run => run.created_at.slice(0, 10) < cutoffDate,
              label
            );
          }

          async function findGeneratedPagesWorkflow() {
            const workflows = await listWorkflows();

            // Use only an exact path match. Do not guess based on a name.
            const matches = workflows.filter(workflow =>
              workflow.path === LEGACY_PAGES_PATH
            );

            if (matches.length !== 1) {
              console.log(
                `Generated Pages workflow path matched ${matches.length} ` +
                `workflow(s); skipping its history safely.`
              );

              console.log(
                "Available workflow entries matching 'pages' or 'deploy':"
              );

              for (const workflow of workflows.filter(workflow =>
                /pages|deploy/i.test(
                  `${workflow.name || ""} ${workflow.path || ""}`
                )
              )) {
                console.log(
                  `- name=${workflow.name}; id=${workflow.id}; ` +
                  `path=${workflow.path}`
                );
              }

              return null;
            }

            const workflow = matches[0];

            console.log(
              `Verified generated Pages workflow: ${workflow.path}; ` +
              `ID ${workflow.id}`
            );

            return workflow.id;
          }

          async function pruneLegacyPagesBeforeDate() {
            const workflowId = await findGeneratedPagesWorkflow();

            if (workflowId === null) return;

            const runs = await getWorkflowRuns(workflowId, null);

            await deleteCompletedRuns(
              runs,
              run => run.created_at.slice(0, 10) < cutoffDate,
              "generated pages-build-deployment"
            );
          }

          async function pruneAllLegacyPagesHistory() {
            const workflowId = await findGeneratedPagesWorkflow();

            if (workflowId === null) {
              throw new Error(
                "Cannot perform the requested full generated Pages cleanup: " +
                "the workflow was not uniquely identified. No Pages runs deleted."
              );
            }

            const runs = await getWorkflowRuns(workflowId, null);

            // This function is reachable only after manual DELETE confirmation.
            await deleteCompletedRuns(
              runs,
              () => true,
              "generated pages-build-deployment"
            );
          }

          async function findOwnWorkflowId() {
            const workflows = await listWorkflows();

            const matches = workflows.filter(workflow =>
              workflow.path === SELF_WORKFLOW_PATH
            );

            if (matches.length !== 1) {
              throw new Error(
                `Expected one cleanup workflow at ${SELF_WORKFLOW_PATH}; ` +
                `found ${matches.length}.`
              );
            }

            return matches[0].id;
          }

          async function pruneOwnOlderRuns() {
            const ownWorkflowId = await findOwnWorkflowId();
            const ownRuns = await getWorkflowRuns(
              ownWorkflowId,
              branch
            );

            await deleteCompletedRuns(
              ownRuns,
              run =>
                String(run.id) !== String(currentRunId) &&
                run.created_at.slice(0, 10) < cutoffDate,
              "prune-old-runs.yml"
            );
          }

          async function main() {
            if (pipelineRun) {
              console.log(
                "Pipeline cleanup: pruning current and legacy workflow histories."
              );

              await pruneBeforeDate(
                "pipeline.yml",
                branch,
                "pipeline.yml"
              );

              await pruneBeforeDate(
                "pages.yml",
                branch,
                "legacy pages.yml"
              );

              await pruneBeforeDate(
                "build-repo.yml",
                branch,
                "legacy build-repo.yml"
              );

              await pruneLegacyPagesBeforeDate();

            } else if (eventName === "workflow_run") {
              console.log(
                `Automatic cleanup after successful workflow ${workflowRef}.`
              );

              await pruneBeforeDate(
                workflowRef,
                branch,
                `workflow ${workflowRef}`
              );

            } else if (workflowRef === LEGACY_OPTION) {
              await pruneAllLegacyPagesHistory();

            } else {
              await pruneBeforeDate(
                workflowRef,
                branch,
                workflowRef
              );
            }

            await pruneOwnOlderRuns();

            console.log(
              `Workflow-history cleanup completed for cutoff ${cutoffDate}.`
            );
          }

          main().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
