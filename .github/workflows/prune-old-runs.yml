name: Prune old successful workflow history

on:
  workflow_call:

permissions:
  actions: write

concurrency:
  group: prune-old-workflow-runs
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Prune old completed pipeline runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const repository = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;
          const currentRunId = String(process.env.CURRENT_RUN_ID);

          if (!repository || !token || !currentRunId) {
            throw new Error("Missing repository, token, or current run ID.");
          }

          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28"
          };

          async function api(path, options = {}) {
            const response = await fetch(
              `https://api.github.com${path}`,
              {
                ...options,
                headers: { ...headers, ...(options.headers || {}) }
              }
            );

            if (!response.ok) {
              throw new Error(
                `GitHub API ${options.method || "GET"} ${path}: ` +
                `${response.status} ${response.statusText}\n` +
                await response.text()
              );
            }

            if (response.status === 204) return null;
            return response.json();
          }

          async function getPipelineRuns() {
            const runs = [];

            for (let page = 1; page <= 10; page++) {
              const params = new URLSearchParams({
                per_page: "100",
                page: String(page),
                branch: "OnTheSide"
              });

              const result = await api(
                `/repos/${repository}/actions/workflows/pipeline.yml/runs?${params}`
              );

              const batch = result.workflow_runs || [];
              runs.push(...batch);

              if (batch.length < 100) break;
            }

            return runs;
          }

          async function main() {
            const runs = await getPipelineRuns();
            const todayUTC = new Date().toISOString().slice(0, 10);

            const candidates = runs.filter(run =>
              run.status === "completed" &&
              String(run.id) !== currentRunId &&
              run.created_at.slice(0, 10) < todayUTC
            );

            console.log(`Inspected ${runs.length} pipeline run(s).`);
            console.log(`Retaining runs created on ${todayUTC} UTC.`);
            console.log(`Selected ${candidates.length} older completed run(s).`);

            let failed = 0;

            for (const run of candidates) {
              try {
                await api(
                  `/repos/${repository}/actions/runs/${run.id}`,
                  { method: "DELETE" }
                );

                console.log(
                  `Deleted pipeline run ${run.id}, created ${run.created_at}, ` +
                  `conclusion ${run.conclusion || "unknown"}.`
                );
              } catch (error) {
                failed++;
                console.error(
                  `Could not delete pipeline run ${run.id}: ${error.message}`
                );
              }

              await new Promise(resolve => setTimeout(resolve, 150));
            }

            if (failed) {
              throw new Error(`Failed to delete ${failed} old pipeline run(s).`);
            }

            console.log("Pipeline-history cleanup completed.");
          }

          main().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
