name: Prune old workflow history

on:
  workflow_call:
    inputs:
      pipeline_run:
        description: Set true when called as the final stage of pipeline.yml
        required: false
        type: boolean
        default: false

  workflow_run:
    workflows:
      - Update pinned GitHub Actions
    types:
      - completed
    branches:
      - OnTheSide

  workflow_dispatch:
    inputs:
      workflow_file:
        description: Select which workflow history to prune
        required: true
        type: choice
        options:
          - pipeline.yml
          - build-repo.yml
          - pages.yml
          - update-action-pins.yml
          - pages.yml (delete all Pages workflow history)

      confirm_cleanup:
        description: Type DELETE to confirm removing workflow history
        required: true
        type: choice
        default: NO
        options:
          - NO
          - DELETE

permissions:
  actions: write

concurrency:
  group: prune-old-workflow-runs
  cancel-in-progress: false

jobs:
  prune:
    if: >-
      inputs.pipeline_run == true ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirm_cleanup == 'DELETE')

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Prune old workflow history
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ inputs.pipeline_run && 'pipeline.yml' || (github.event_name == 'workflow_run' && github.event.workflow_run.workflow_id || inputs.workflow_file || 'pipeline.yml') }}
          PIPELINE_RUN: ${{ inputs.pipeline_run }}
          TARGET_BRANCH: OnTheSide
          CURRENT_RUN_ID: ${{ github.run_id }}

        run: |
          set -euo pipefail

          node <<'NODE'
          const repository = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;
          const eventName = process.env.EVENT_NAME;
          const workflowRef = process.env.WORKFLOW_REF;
          const pipelineRun = process.env.PIPELINE_RUN === "true";
          const branch = process.env.TARGET_BRANCH;
          const currentRunId = process.env.CURRENT_RUN_ID;

          const TIME_ZONE = "America/Chicago";

          const PAGES_WORKFLOW_PATH =
            ".github/workflows/pages.yml";

          const PAGES_ALL_OPTION =
            "pages.yml (delete all Pages workflow history)";

          const SELF_WORKFLOW_PATH =
            ".github/workflows/prune-old-runs.yml";

          if (
            !repository ||
            !token ||
            !workflowRef ||
            !branch ||
            !currentRunId
          ) {
            throw new Error(
              "Missing required repository, workflow, branch, token, or run ID."
            );
          }

          // Return YYYY-MM-DD in the requested IANA timezone.
          // Do not use toISOString().slice(0, 10) for local-date retention:
          // toISOString() always returns the UTC calendar date.
          function dateInTimeZone(date, timeZone = TIME_ZONE) {
            const parts = new Intl.DateTimeFormat("en-US", {
              timeZone,
              year: "numeric",
              month: "2-digit",
              day: "2-digit"
            }).formatToParts(date);

            const values = Object.fromEntries(
              parts.map(part => [part.type, part.value])
            );

            return `${values.year}-${values.month}-${values.day}`;
          }

          function localRunDate(run) {
            if (typeof run.created_at !== "string") {
              return null;
            }

            const date = new Date(run.created_at);

            if (Number.isNaN(date.getTime())) {
              return null;
            }

            return dateInTimeZone(date);
          }

          // Runs dated today in Central Time are retained.
          // Only completed runs whose Central Time date is earlier than
          // this cutoff date are eligible for deletion.
          const cutoffDate = dateInTimeZone(new Date());

          console.log(`Repository: ${repository}`);
          console.log(`Branch: ${branch}`);
          console.log(`Current cleanup run: ${currentRunId}`);
          console.log(`Retention timezone: ${TIME_ZONE}`);
          console.log(`Retention cutoff (${TIME_ZONE}): ${cutoffDate}`);
          console.log(
            `Completed runs dated before ${cutoffDate} in ${TIME_ZONE} are eligible for deletion.`
          );

          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28"
          };

          async function githubApi(path, options = {}) {
            const response = await fetch(
              `https://api.github.com${path}`,
              {
                ...options,
                headers: {
                  ...headers,
                  ...(options.headers || {})
                }
              }
            );

            if (!response.ok) {
              throw new Error(
                `GitHub API ${options.method || "GET"} ${path} failed: ` +
                `${response.status} ${response.statusText}\n` +
                await response.text()
              );
            }

            if (response.status === 204) {
              return null;
            }

            return response.json();
          }

          async function listWorkflows() {
            const workflows = [];

            for (let page = 1; page <= 10; page++) {
              const result = await githubApi(
                `/repos/${repository}/actions/workflows?per_page=100&page=${page}`
              );

              const items = result.workflows || [];

              workflows.push(...items);

              if (items.length < 100) {
                break;
              }
            }

            return workflows;
          }

          async function findWorkflowIdByPath(path, label) {
            const workflows = await listWorkflows();

            const matches = workflows.filter(
              workflow => workflow.path === path
            );

            if (matches.length !== 1) {
              throw new Error(
                `${label}: expected exactly one workflow at ${path}; ` +
                `found ${matches.length}. No history was deleted for it.`
              );
            }

            const workflow = matches[0];

            console.log(
              `Verified ${label}: ${workflow.name}; ` +
              `ID ${workflow.id}; path ${workflow.path}`
            );

            return workflow.id;
          }

          async function getWorkflowRuns(workflowIdOrFile, branchFilter) {
            const runs = [];

            // GitHub accepts a workflow ID or workflow filename.
            for (let page = 1; page <= 10; page++) {
              const parameters = new URLSearchParams({
                per_page: "100",
                page: String(page)
              });

              if (branchFilter) {
                parameters.set("branch", branchFilter);
              }

              const path =
                `/repos/${repository}/actions/workflows/` +
                `${encodeURIComponent(String(workflowIdOrFile))}/runs?${parameters}`;

              const result = await githubApi(path);
              const pageRuns = result.workflow_runs || [];

              runs.push(...pageRuns);

              if (pageRuns.length < 100) {
                break;
              }
            }

            return runs;
          }

          async function deleteCompletedRuns(
            runs,
            shouldDelete,
            label
          ) {
            const completedRuns = runs.filter(
              run => run.status === "completed"
            );

            const selected = completedRuns.filter(shouldDelete);

            const validDates = runs
              .map(run => ({
                run,
                localDate: localRunDate(run)
              }))
              .filter(item => item.localDate !== null)
              .sort((a, b) =>
                a.localDate.localeCompare(b.localDate)
              );

            console.log("");
            console.log(`--- ${label} ---`);
            console.log(`Runs returned by API: ${runs.length}`);
            console.log(`Completed runs: ${completedRuns.length}`);
            console.log(`Completed runs selected: ${selected.length}`);

            if (validDates.length > 0) {
              const oldest = validDates[0];
              const newest = validDates[validDates.length - 1];

              console.log(
                `Oldest returned run: ${oldest.run.id}; ` +
                `UTC=${oldest.run.created_at}; ` +
                `${TIME_ZONE}=${oldest.localDate}`
              );

              console.log(
                `Newest returned run: ${newest.run.id}; ` +
                `UTC=${newest.run.created_at}; ` +
                `${TIME_ZONE}=${newest.localDate}`
              );
            }

            if (runs.length === 0) {
              console.log(
                "No standalone workflow runs were returned for this workflow identifier and branch."
              );
            }

            let deleted = 0;
            let failed = 0;

            for (const run of selected) {
              const runDate = localRunDate(run);

              // Never delete the currently executing cleanup run.
              if (String(run.id) === String(currentRunId)) {
                console.log(
                  `Keeping current cleanup run ${run.id}.`
                );
                continue;
              }

              try {
                await githubApi(
                  `/repos/${repository}/actions/runs/${run.id}`,
                  { method: "DELETE" }
                );

                deleted++;

                console.log(
                  `Deleted ${label} run ${run.id}: ` +
                  `UTC=${run.created_at}; ` +
                  `${TIME_ZONE}=${runDate}; ` +
                  `conclusion=${run.conclusion || run.status}`
                );
              } catch (error) {
                failed++;

                console.error(
                  `Could not delete ${label} run ${run.id}: ${error.message}`
                );
              }

              await new Promise(resolve =>
                setTimeout(resolve, 150)
              );
            }

            console.log(
              `${label}: deleted ${deleted}; failed ${failed}.`
            );

            if (failed > 0) {
              throw new Error(
                `${failed} ${label} run(s) could not be deleted.`
              );
            }
          }

          async function pruneBeforeDate(
            workflowIdOrFile,
            branchFilter,
            label
          ) {
            const runs = await getWorkflowRuns(
              workflowIdOrFile,
              branchFilter
            );

            await deleteCompletedRuns(
              runs,
              run => {
                const runDate = localRunDate(run);

                return (
                  runDate !== null &&
                  runDate < cutoffDate &&
                  String(run.id) !== String(currentRunId)
                );
              },
              label
            );
          }

          async function pruneAllPagesHistory() {
            // Resolve the Pages workflow dynamically instead of hard-coding
            // its workflow ID.
            const pagesWorkflowId = await findWorkflowIdByPath(
              PAGES_WORKFLOW_PATH,
              "Publish GitHub Pages"
            );

            // No branch filter: include all completed runs returned for
            // this workflow across branches and dates.
            const runs = await getWorkflowRuns(
              pagesWorkflowId,
              null
            );

            // Only reachable through manual DELETE confirmation.
            await deleteCompletedRuns(
              runs,
              () => true,
              "all pages.yml workflow history"
            );
          }

          async function pruneOwnOlderRuns() {
            const ownWorkflowId = await findWorkflowIdByPath(
              SELF_WORKFLOW_PATH,
              "Prune old workflow history"
            );

            const ownRuns = await getWorkflowRuns(
              ownWorkflowId,
              branch
            );

            await deleteCompletedRuns(
              ownRuns,
              run => {
                const runDate = localRunDate(run);

                return (
                  String(run.id) !== String(currentRunId) &&
                  runDate !== null &&
                  runDate < cutoffDate
                );
              },
              "prune-old-runs.yml"
            );
          }

          async function main() {
            if (pipelineRun) {
              console.log(
                "Pipeline cleanup: pruning old workflow history."
              );

              // These files are reusable workflow_call workflows in the
              // current pipeline. Their jobs appear inside pipeline runs;
              // they do not necessarily have separate run-history entries.
              console.log(
                "Note: reusable workflow job history is contained in its parent pipeline run."
              );

              // Remove old GitHub Actions pin updater runs.
              await pruneBeforeDate(
                "update-action-pins.yml",
                branch,
                "update-action-pins.yml"
              );

              // Remove old parent pipeline runs. This also removes their
              // nested reusable-workflow job history from the Actions UI.
              await pruneBeforeDate(
                "pipeline.yml",
                branch,
                "pipeline.yml"
              );

            } else if (eventName === "workflow_run") {
              console.log(
                `Automatic cleanup after successful workflow ${workflowRef}.`
              );

              await pruneBeforeDate(
                workflowRef,
                branch,
                `workflow ${workflowRef}`
              );

            } else if (workflowRef === PAGES_ALL_OPTION) {
              await pruneAllPagesHistory();

            } else {
              await pruneBeforeDate(
                workflowRef,
                branch,
                workflowRef
              );
            }

            // Keep today's cleanup run and remove only older completed
            // cleanup workflow runs.
            await pruneOwnOlderRuns();

            console.log(
              `Workflow-history cleanup completed for cutoff ${cutoffDate} (${TIME_ZONE}).`
            );
          }

          main().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
