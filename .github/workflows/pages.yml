name: Publish GitHub Pages

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out published files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: OnTheSide

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Validate source Now and Later payloads
        run: python3 tools/validate_repo_files.py --areas Now Later

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          # Copy the homepage and complete Now repository.
          cp index.html _site/index.html
          cp -a Now _site/Now

          # Background audio location.
          AUDIO_DIR="Now/io.page.background.track"
          AUDIO_MANIFEST="$AUDIO_DIR/current.json"

          # Confirm the audio manifest exists.
          test -s "$AUDIO_MANIFEST"

          # Read the selected filename from current.json.
          AUDIO_FILE="$(python3 -c '
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              manifest = json.load(f)

          filename = manifest.get("file")

          if (
              not isinstance(filename, str)
              or not re.fullmatch(
                  r"\d+_.+\.(mp3|opus|m4a)",
                  filename,
                  re.IGNORECASE
              )
          ):
              raise SystemExit(
                  "Invalid background audio filename in current.json"
              )

          print(filename)
          ' "$AUDIO_MANIFEST")"

          echo "Selected background audio: $AUDIO_FILE"

          # Confirm the selected audio exists in the source repository.
          test -s "$AUDIO_DIR/$AUDIO_FILE"

          # Confirm the manifest and selected audio were copied to Pages staging.
          test -s "_site/$AUDIO_DIR/current.json"
          test -s "_site/$AUDIO_DIR/$AUDIO_FILE"

          # Confirm normal website files exist.
          test -s _site/index.html
          test -s _site/Now/addons.xml

          echo "Verified background audio: $AUDIO_FILE"
          echo "Website files prepared successfully."

      - name: Validate staged Pages payload
        run: python3 tools/validate_repo_files.py --root _site --areas Now

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}

    steps:
      - name: Deploy website (attempt 1)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Wait before retry 1
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 15

      - name: Deploy website (attempt 2)
        id: deployment_retry_1
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Wait before retry 2
        if: ${{ steps.deployment_retry_1.outcome == 'failure' }}
        run: sleep 45

      - name: Deploy website (attempt 3)
        id: deployment_retry_2
        if: ${{ steps.deployment_retry_1.outcome == 'failure' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Fail if all deployment attempts failed
        if: >-
          ${{
            !cancelled() &&
            steps.deployment.outcome == 'failure' &&
            steps.deployment_retry_1.outcome == 'failure' &&
            steps.deployment_retry_2.outcome == 'failure'
          }}
        run: |
          echo "::error::GitHub Pages deployment failed after all 3 attempts."
          exit 1
