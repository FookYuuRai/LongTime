name: Publish GitHub Pages

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out published files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: OnTheSide

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Validate source Now and Later payloads
        run: python3 tools/validate_repo_files.py --areas Now Later

      - name: Diagnose GitHub Pages API response
        shell: bash
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_ENABLEMENT_TOKEN }}
        run: |
          set -uo pipefail

          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          SUMMARY="$GITHUB_STEP_SUMMARY"
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"

          echo "::group::GitHub Pages API preflight diagnostics"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Request: GET /repos/${GITHUB_REPOSITORY}/pages"

          write_summary() {
            {
              echo "### GitHub Pages API preflight"
              echo
              echo "- Repository: \`${GITHUB_REPOSITORY}\`"
              echo "- API response: **$1**"
              echo
              echo "$2"
            } >> "$SUMMARY"
          }

          if [[ -z "${PAGES_TOKEN:-}" ]]; then
            MESSAGE="PAGES_ENABLEMENT_TOKEN was not supplied to the Pages workflow. Check the repository Actions secret and the caller workflow's secrets: inherit setting."
            echo "::error title=Missing Pages activation token::$MESSAGE"
            echo "$MESSAGE"
            write_summary "Missing token" "$MESSAGE"
            echo "::endgroup::"
            exit 1
          fi

          echo "Checking whether GitHub currently exposes a Pages site..."
          HTTP_STATUS="$(curl --silent --show-error --max-time 25 --output "$RESPONSE_FILE" --write-out '%{http_code}' --header "Accept: application/vnd.github+json" --header "Authorization: Bearer ${PAGES_TOKEN}" --header "X-GitHub-Api-Version: 2022-11-28" "$API_URL")"
          CURL_EXIT=$?

          if [[ "$CURL_EXIT" -ne 0 || "$HTTP_STATUS" == "000" ]]; then
            MESSAGE="The preflight request could not obtain an HTTP response. This may be a temporary network or GitHub API issue. The Configure GitHub Pages action will still make its own attempt."
            echo "::warning title=Pages API preflight unavailable::$MESSAGE"
            echo "$MESSAGE"
            write_summary "Request unavailable" "$MESSAGE"
            echo "::endgroup::"
            exit 0
          fi

          echo "HTTP status: $HTTP_STATUS"
          case "$HTTP_STATUS" in
            200)
              MESSAGE="GitHub returned HTTP 200. An existing Pages site is visible to the supplied token. The workflow will continue with normal Pages configuration."
              echo "$MESSAGE"
              write_summary "200 OK — Pages site found" "$MESSAGE"
              ;;
            404)
              MESSAGE="GitHub returned HTTP 404 for the Get Pages site request. This means GitHub did not return an active Pages site for this repository and token. This can occur when Pages has not yet been enabled, or when Pages was previously disabled or deactivated. A 404 alone does not establish which situation applies, and GitHub can also return 404 when a resource is not accessible to the token.

          The next Configure GitHub Pages step will run with PAGES_ENABLEMENT_TOKEN and enablement: true. It will attempt to enable or initialize GitHub Pages.

          If activation succeeds, the workflow can continue to build and deploy the website. If activation fails, check that the PAT has access to this repository and the required Pages write permission."
              echo "::notice title=Pages site not currently returned — activation will be attempted::GitHub returned HTTP 404. Pages may not be enabled or may have been deactivated. The next step will attempt activation using the supplied PAT."
              echo
              echo "DETAILED DIAGNOSTIC:"
              echo "$MESSAGE"
              write_summary "404 Not Found — activation will be attempted" "$MESSAGE"
              ;;
            401)
              MESSAGE="GitHub returned HTTP 401 Unauthorized. The supplied Pages activation token was not accepted. Check whether PAGES_ENABLEMENT_TOKEN is present, valid, unexpired, and copied in full."
              echo "::error title=Pages activation token rejected::$MESSAGE"
              echo "$MESSAGE"
              write_summary "401 Unauthorized" "$MESSAGE"
              echo "::endgroup::"
              exit 1
              ;;
            403)
              MESSAGE="GitHub returned HTTP 403 Forbidden. The token was recognized but does not have sufficient access to this repository or the Pages API. Check the fine-grained PAT repository selection and Pages read/write permissions. The enablement operation requires Pages write access."
              echo "::error title=Pages activation permission denied::$MESSAGE"
              echo "$MESSAGE"
              write_summary "403 Forbidden" "$MESSAGE"
              echo "::endgroup::"
              exit 1
              ;;
            *)
              MESSAGE="GitHub returned an unexpected HTTP status ($HTTP_STATUS) when checking the Pages site. The Configure GitHub Pages action will make its own attempt. Check the action output for the final result."
              echo "::warning title=Unexpected Pages API response::$MESSAGE"
              echo "$MESSAGE"
              write_summary "$HTTP_STATUS — unexpected response" "$MESSAGE"
              ;;
          esac
          echo "::endgroup::"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          token: ${{ secrets.PAGES_ENABLEMENT_TOKEN }}
          enablement: true

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -a Now _site/Now
          test -d Oldies
          cp -a Oldies _site/Oldies
          test -s _site/Oldies/index.html

          AUDIO_DIR="Now/io.page.background.track"
          AUDIO_MANIFEST="$AUDIO_DIR/current.json"
          test -s "$AUDIO_MANIFEST"
          AUDIO_FILE="$(python3 -c '
          import json
          import re
          import sys
          with open(sys.argv[1], encoding="utf-8") as f:
              manifest = json.load(f)
          filename = manifest.get("file")
          if not isinstance(filename, str) or not re.fullmatch(r"\d+_.+\.(mp3|opus|m4a)", filename, re.IGNORECASE):
              raise SystemExit("Invalid background audio filename in current.json")
          print(filename)
          ' "$AUDIO_MANIFEST")"
          echo "Selected background audio: $AUDIO_FILE"
          test -s "$AUDIO_DIR/$AUDIO_FILE"
          test -s "_site/$AUDIO_DIR/current.json"
          test -s "_site/$AUDIO_DIR/$AUDIO_FILE"
          test -s _site/index.html
          test -s _site/Now/addons.xml
          echo "Verified background audio: $AUDIO_FILE"
          echo "Website files prepared successfully."

      - name: Download verified NightShift font pack for public installer access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site/assets/nightshift
          curl --fail --silent --show-error --location --max-time 180 \
            --header "Accept: application/octet-stream" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/FookYuuRai/LongTime/releases/assets/715997084 \
            --output _site/assets/nightshift/fontpack_combined.zip
          echo '99f85a7a2e1522446bc49bea0021df77367881f29a4b48e476c1b82a639643cc  _site/assets/nightshift/fontpack_combined.zip' | sha256sum --check --status
          test -s _site/assets/nightshift/fontpack_combined.zip
          echo 'Verified private Release font asset staged for public GitHub Pages delivery.'

      - name: Validate staged Pages payload
        run: python3 tools/validate_repo_files.py --root _site --areas Now

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    steps:
      - name: Deploy website (attempt 1)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
      - name: Wait before retry 1
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 15
      - name: Deploy website (attempt 2)
        id: deployment_retry_1
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
      - name: Wait before retry 2
        if: ${{ steps.deployment_retry_1.outcome == 'failure' }}
        run: sleep 45
      - name: Deploy website (attempt 3)
        id: deployment_retry_2
        if: ${{ steps.deployment_retry_1.outcome == 'failure' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
      - name: Fail if all deployment attempts failed
        if: >-
          ${{
            !cancelled() &&
            steps.deployment.outcome == 'failure' &&
            steps.deployment_retry_1.outcome == 'failure' &&
            steps.deployment_retry_2.outcome == 'failure'
          }}
        run: |
          echo "::error::GitHub Pages deployment failed after all 3 attempts."
          exit 1
