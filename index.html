<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03050c">
  <meta name="color-scheme" content="dark">
  <title>LongTime — Add-ons</title>

  <style>
    :root {
      --bg: #03050c;
      --panel: #071426;
      --header: #123b66;
      --text: #f0f6ff;
      --grey: #9cb0c9;
      --blue: #49c9ff;
      --focus: #35bfff;
      --pink: #ff5cbf;
      --line: rgba(53,191,255,.5);
      --page-width: 920px;
      --page-gutter: clamp(8px, 3vw, 24px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      text-shadow: 0 1px 4px rgba(0,0,0,.95);
      font: 16px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

      /* Original background: intentionally preserved. */
      background: linear-gradient(rgba(3,5,12,.28),rgba(3,5,12,.42)),url("Now/skin.nightshift/resources/fanart.jpg"),var(--bg);
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
    }

    .wrap {
      width: min(100%, calc(var(--page-width) + 2 * var(--page-gutter)));
      margin: 0 auto;
      padding:
        max(20px, env(safe-area-inset-top))
        var(--page-gutter)
        max(28px, env(safe-area-inset-bottom));
    }

    .panel {
      background: rgba(7,20,38,.3);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 0 28px rgba(53,191,255,.14);
      overflow: hidden;
      min-width: 0;
    }

    .head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: rgba(18,59,102,.3);
      border-bottom: 1px solid var(--line);
      min-width: 0;
    }

    .head img {
      display: block;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      object-fit: contain;
      border-radius: 8px;
    }

    .head h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: .02em;
      overflow-wrap: anywhere;
    }

    .crumbs {
      margin: 0;
      color: var(--grey);
      font-size: .9rem;
      overflow-wrap: anywhere;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 6px;
    }

    li {
      margin: 0;
    }

    li a {
      display: block;
      padding: 11px 14px;
      margin: 3px 0;
      border-radius: 4px;
      border: 1px solid rgba(53,191,255,.12);
      background: rgba(3,5,12,.3);
      color: var(--text);
      text-decoration: none;
      overflow-wrap: anywhere;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow .12s, border-color .12s, background .12s;
    }

    li a:hover,
    li a:focus-visible {
      background: rgba(53,191,255,.1);
      color: #fff;
      border-color: var(--focus);
      box-shadow:
        0 0 5px var(--focus),
        0 0 16px rgba(53,191,255,.55),
        inset 0 0 10px rgba(53,191,255,.25);
      text-shadow: 0 0 6px rgba(73,201,255,.75);
      outline: none;
    }

    li a.file:hover,
    li a.file:focus-visible {
      border-color: var(--pink);
      background: rgba(255,92,191,.1);
      box-shadow:
        0 0 5px var(--pink),
        0 0 16px rgba(255,92,191,.5),
        inset 0 0 10px rgba(255,92,191,.22);
      text-shadow: 0 0 6px rgba(255,92,191,.75);
    }

    li a::before {
      content: "\25B8";
      display: inline-block;
      width: 1.4em;
      color: var(--blue);
    }

    li a.file::before {
      content: "\2193";
      color: var(--pink);
    }

    /* Background ambience player */
    .audio-area {
      margin: 10px 12px 12px;
      padding: 12px;
      border: 1px solid rgba(53,191,255,.28);
      border-radius: 5px;
      background: rgba(3,5,12,.36);
    }

    .audio-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin-bottom: 10px;
    }

    .audio-title {
      margin: 0;
      font-size: .94rem;
      font-weight: 600;
      color: var(--text);
    }

    .audio-status {
      margin: 0;
      color: var(--grey);
      font-size: .8rem;
      overflow-wrap: anywhere;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .audio-button {
      min-height: 42px;
      padding: 9px 16px;
      border: 1px solid var(--focus);
      border-radius: 4px;
      background: rgba(53,191,255,.1);
      color: var(--text);
      font: inherit;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .audio-button:hover,
    .audio-button:focus-visible {
      outline: none;
      background: rgba(53,191,255,.2);
      box-shadow: 0 0 12px rgba(53,191,255,.4);
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 180px;
      min-width: 0;
      color: var(--grey);
      font-size: .85rem;
    }

    .volume-control label {
      white-space: nowrap;
    }

    .volume-control input {
      width: 100%;
      min-width: 60px;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .foot {
      padding: 10px 18px;
      color: var(--grey);
      font-size: .8rem;
      border-top: 1px solid var(--line);
    }

    /* Narrow phones */
    @media (max-width: 520px) {
      :root {
        --page-gutter: 8px;
      }

      .wrap {
        padding-top: max(12px, env(safe-area-inset-top));
      }

      .head {
        gap: 10px;
        padding: 12px;
      }

      .head h1 {
        font-size: 1.1rem;
      }

      .audio-area {
        margin: 8px;
        padding: 10px;
      }

      .audio-controls {
        gap: 10px;
      }

      .audio-button {
        flex: 0 0 auto;
      }

      .volume-control {
        flex-basis: 100%;
      }

      .foot {
        padding: 10px 12px;
      }
    }

    /* Short landscape viewports */
    @media (orientation: landscape) and (max-height: 500px) {
      .wrap {
        padding-top: max(8px, env(safe-area-inset-top));
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }

      .head {
        padding-top: 9px;
        padding-bottom: 9px;
      }

      .head img {
        width: 36px;
        height: 36px;
        flex-basis: 36px;
      }

      .audio-area {
        margin-top: 6px;
        margin-bottom: 8px;
      }
    }

    /* Respect accessibility settings */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="panel" aria-label="LongTime add-on repository">
      <header class="head">
        <img
          src="Now/skin.nightshift/resources/icon.png"
          alt=""
          width="44"
          height="44"
        >
        <div>
          <h1>LongTime</h1>
          <p class="crumbs">Add-ons</p>
        </div>
      </header>

      <!-- Background audio: file is hosted outside Now/. -->
      <section class="audio-area" aria-label="Background ambience">
        <div class="audio-heading">
          <h2 class="audio-title">Background ambience</h2>
          <p class="audio-status" id="audio-status" role="status" aria-live="polite">
            Starting audio…
          </p>
        </div>

        <div class="audio-controls">
          <button
            class="audio-button"
            id="audio-toggle"
            type="button"
            aria-pressed="false"
          >▶ Play ambience</button>

          <div class="volume-control">
            <label for="audio-volume">Volume</label>
            <input
              id="audio-volume"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0.35"
              aria-label="Background audio volume"
            >
          </div>
        </div>

        <audio
          id="background-audio"
          src="audio/27_aquatic-ambiance.opus"
          loop
          preload="auto"
          playsinline
        ></audio>
      </section>

      <nav aria-label="Repository folders">
        <ul>
          <li><a href="Now/">Now/</a></li>
        </ul>
      </nav>

      <footer class="foot">Add-on repository for Kodi</footer>
    </section>
  </main>

  <script>
    (() => {
      const audio = document.getElementById("background-audio");
      const toggle = document.getElementById("audio-toggle");
      const volume = document.getElementById("audio-volume");
      const status = document.getElementById("audio-status");

      audio.volume = Number(volume.value);

      function showPlaying() {
        toggle.textContent = "❚❚ Pause ambience";
        toggle.setAttribute("aria-pressed", "true");
        status.textContent = "Ambience playing";
      }

      function showPaused(message) {
        toggle.textContent = "▶ Play ambience";
        toggle.setAttribute("aria-pressed", "false");
        status.textContent = message;
      }

      async function startAudio() {
        try {
          await audio.play();
          showPlaying();
        } catch (error) {
          showPaused(
            error && error.name === "NotAllowedError"
              ? "Tap Play to start audio"
              : "Audio unavailable — check the file path"
          );
        }
      }

      toggle.addEventListener("click", async () => {
        if (audio.paused) {
          await startAudio();
        } else {
          audio.pause();
        }
      });

      volume.addEventListener("input", () => {
        audio.volume = Number(volume.value);
      });

      audio.addEventListener("playing", showPlaying);

      audio.addEventListener("pause", () => {
        showPaused("Ambience paused");
      });

      audio.addEventListener("error", () => {
        showPaused("Audio unavailable — check the file path");
      });

      /* Try autoplay; browsers may require a user gesture. */
      startAudio();
    })();
  </script>
</body>
</html>
